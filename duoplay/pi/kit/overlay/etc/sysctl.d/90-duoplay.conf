# DuoPlay: a video frame arrives as a burst of packets; give sockets room for it.
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.core.rmem_default = 1048576
net.core.wmem_default = 524288
net.core.netdev_max_backlog = 2000
# An appliance: if the kernel ever panics, start over instead of sitting there.
kernel.panic = 10
